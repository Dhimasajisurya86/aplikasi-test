<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container" id="main-container">
        <div class="card">
            <h1 class="question">Kamu sayang nggak sama aku? 🥺</h1>
            <div class="image-container">
                <img src="https://media.tenor.com/ef3xU75_XF4AAAAi/tkthao219-bubududu.gif" alt="Cute Bear" width="150">
            </div>
            <div class="buttons">
                <button id="btn-yes" class="btn btn-yes">Ya saya mau I LOVE YOU ❤️</button>
                <button id="btn-no" class="btn btn-no">Tidakkkkkkkkk</button>
            </div>
        </div>
    </div>
    
    <div class="success-message" id="success-message" style="display: none;">
        <h1>Yeayyy! I Love You Too! ❤️❤️❤️</h1>
        <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Happy Bears" width="200">
    </div>

    <script src="script.js"></script>
</body>
</html>
