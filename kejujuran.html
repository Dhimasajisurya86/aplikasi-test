<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kejujuran Hati ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card form-card">
            <h1 class="question">Satu hal lagi... 🥺</h1>
            <p class="subtitle">Jujur dari dalam hati terdalam kamu, apa sih yang sebenarnya kamu rasain ke aku?</p>
            
            <div class="image-container">
                <img src="https://media.tenor.com/725BIf73D_QAAAAi/tkthao219-bubududu.gif" alt="Thinking Bear" width="120">
            </div>

            <textarea id="pesan-jujur" class="pesan-input" placeholder="Tulis semua perasaan jujurmu di sini ya... panjang juga gapapa kok 🥰" rows="5"></textarea>
            
            <button id="btn-kirim" class="btn btn-yes" style="margin-top: 15px; width: 100%;">Kirim Perasaanku 💌</button>
        </div>
    </div>
    
    <div class="success-message" id="success-message-form" style="display: none;">
        <h1>Makasih ya udah jujur! ❤️</h1>
        <p class="subtitle">Pesanmu sudah tersimpan dengan aman.</p>
        <img src="https://media.tenor.com/lM_L0_O3MngAAAAi/tkthao219-bubududu.gif" alt="Happy Bears Hug" width="200" style="margin-top: 20px;">
    </div>

    <script src="kejujuran.js"></script>
    <script src="love.js"></script>
</body>
</html>
